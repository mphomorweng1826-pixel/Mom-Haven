
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Mom's Haven</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5eee8;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
            color: #795548;
        }

        .logo h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #4e342e;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7ccc8;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #8d6e63;
            box-shadow: 0 0 4px rgba(141, 110, 99, 0.3);
        }

        .security-note {
            color: #777;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #795548;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #5d4037;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #795548;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            <h1>Mom's Haven</h1>
            <p>Create your account and join our community</p>
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    maxlength="150"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    maxlength="255"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="securityQuestion">Security Question</label>

                <select
                    id="securityQuestion"
                    name="securityQuestion"
                    required
                >
                    <option value="">Choose a security question</option>
                    <option value="What was the name of your first school?">
                        What was the name of your first school?
                    </option>
                    <option value="What is the name of your childhood best friend?">
                        What is the name of your childhood best friend?
                    </option>
                    <option value="What was the name of your first pet?">
                        What was the name of your first pet?
                    </option>
                    <option value="In what city were you born?">
                        In what city were you born?
                    </option>
                    <option value="What is your favourite childhood memory?">
                        What is your favourite childhood memory?
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="securityAnswer">Your Answer</label>

                <input
                    type="password"
                    id="securityAnswer"
                    name="securityAnswer"
                    placeholder="Enter your security answer"
                    maxlength="150"
                    autocomplete="off"
                    required
                >

                <p class="security-note">
                    Remember your answer. You will need it if you
                    forget your password. Avoid answers that other
                    people can easily guess.
                </p>
            </div>

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <p id="message" class="message" role="status" aria-live="polite"></p>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Log in</a>
        </div>

    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const registerButton = document.getElementById('registerButton');

        registerForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const securityQuestion = document.getElementById('securityQuestion').value;
            const securityAnswer = document.getElementById('securityAnswer').value.trim();

            message.textContent = '';
            message.style.color = '#c62828';

            if (password.length < 8) {
                message.textContent = 'Your password must contain at least 8 characters.';
                return;
            }

            if (new TextEncoder().encode(password).length > 72) {
                message.textContent = 'Your password is too long.';
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = 'The passwords do not match.';
                return;
            }

            if (!securityQuestion || !securityAnswer) {
                message.textContent = 'Please choose a security question and enter your answer.';
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = 'Creating Account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        fullName,
                        email,
                        password,
                        securityQuestion,
                        securityAnswer
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Registration failed.');
                }

                message.style.color = '#2e7d32';
                message.textContent = 'Account created successfully! Redirecting to login...';

                registerForm.reset();

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (error) {
                message.style.color = '#c62828';
                message.textContent = error.message;
            } finally {
                registerButton.disabled = false;
                registerButton.textContent = 'Create Account';
            }
        });
    </script>

</body>
</html>
