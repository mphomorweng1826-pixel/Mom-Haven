
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Mom's Haven</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F5EBDD;
            color: #725541;
        }

        .navbar {
            background: #B69B83;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: #FFFDF9;
            margin: 0;
            letter-spacing: 1px;
        }

        .container {
            max-width: 460px;
            margin: 90px auto;
            padding: 40px 30px;
            text-align: center;
            background: #FFFDF9;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(114,85,65,0.12);
        }

        .heart {
            font-size: 45px;
            color: #B69B83;
        }

        h1 {
            color: #725541;
            font-size: 28px;
        }

        p {
            color: #927A66;
            line-height: 1.7;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid #D8C6B5;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            background: #B69B83;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #927A66;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #725541;
            text-decoration: none;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message a {
            color: #725541;
            display: block;
            margin-top: 15px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #A18B78;
        }

        @media (max-width: 520px) {
            .container {
                margin: 50px 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>Mom's Haven ♡</h2>
    </nav>

    <div class="container">

        <div class="heart">♡</div>

        <h1>Forgot Your Password?</h1>

        <p>
            Don't worry, Mom. It happens!
            Enter the email address associated with your
            Mom's Haven account to request a password reset.
        </p>

        <form id="forgotPasswordForm">

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email address"
                autocomplete="email"
                required
            >

            <button type="submit" id="resetButton">
                Reset Password
            </button>

        </form>

        <div class="message" id="message" role="status" aria-live="polite"></div>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

        <div class="footer">
            A little space made with love ♡
        </div>

    </div>

    <script>
        const forgotPasswordForm =
            document.getElementById("forgotPasswordForm");

        const message =
            document.getElementById("message");

        const resetButton =
            document.getElementById("resetButton");


        forgotPasswordForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            resetButton.disabled = true;
            resetButton.textContent = "Please wait...";

            message.replaceChildren();

            try {

                const response = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ email })
                });

                // Read the response as text first.
                const responseText = await response.text();

                // Convert the response into JSON.
                let result;

                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error("Server returned:", responseText);

                    throw new Error(
                        "The server did not return a valid response. Please check that the Mom's Haven server is running correctly."
                    );
                }

                if (!response.ok) {
                    throw new Error(
                        result.message || "Unable to process your request."
                    );
                }

                message.style.color = "#58734F";
                message.textContent = result.message;

                // Show the reset link for local development.
                if (result.resetLink) {

                    const link = document.createElement("a");

                    link.href = result.resetLink;
                    link.textContent = "Open your password reset page";

                    message.appendChild(link);
                }

                forgotPasswordForm.reset();

            } catch (error) {

                console.error("Forgot password error:", error);

                message.style.color = "#A94442";
                message.textContent =
                    error.message || "Something went wrong. Please try again.";

            } finally {

                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";

            }

        });
    </script>

</body>
</html>
