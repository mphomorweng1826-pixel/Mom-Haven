
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Mom's Haven</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F5EBDD;
            color: #725541;
        }

        .navbar {
            background: #B69B83;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: #FFFDF9;
            margin: 0;
            letter-spacing: 1px;
        }

        .container {
            max-width: 460px;
            margin: 90px auto;
            padding: 40px 30px;
            text-align: center;
            background: #FFFDF9;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(114,85,65,0.12);
        }

        .heart {
            font-size: 45px;
            color: #B69B83;
        }

        h1 {
            color: #725541;
            font-size: 28px;
        }

        p {
            color: #927A66;
            line-height: 1.7;
        }

        .form-group {
            margin: 18px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #725541;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D8C6B5;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #B69B83;
            box-shadow: 0 0 4px rgba(182,155,131,0.3);
        }

        button {
            width: 100%;
            background: #B69B83;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
        }

        button:hover {
            background: #927A66;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .security-question {
            background: #F5EBDD;
            padding: 16px;
            border-radius: 10px;
            margin: 20px 0;
            color: #725541;
            font-weight: bold;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #725541;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #A18B78;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 520px) {
            .container {
                margin: 50px 20px;
                padding: 35px 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>Mom's Haven ♡</h2>
    </nav>

    <div class="container">

        <div class="heart">♡</div>

        <h1>Forgot Your Password?</h1>

        <p>
            Don't worry, Mom. It happens!
            Follow the steps below to recover access
            to your Mom's Haven account.
        </p>

        <!-- STEP 1: ENTER EMAIL -->
        <form id="emailForm">

            <div class="form-group">
                <label for="email">Registered Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email address"
                    autocomplete="email"
                    maxlength="255"
                    required
                >
            </div>

            <button type="submit" id="questionButton">
                Continue
            </button>

        </form>

        <!-- STEP 2: ANSWER SECURITY QUESTION -->
        <form id="recoveryForm" class="hidden">

            <div class="security-question">
                <p>Answer your security question:</p>
                <span id="securityQuestion"></span>
            </div>

            <div class="form-group">
                <label for="securityAnswer">Your Answer</label>

                <input
                    type="password"
                    id="securityAnswer"
                    name="securityAnswer"
                    placeholder="Enter your security answer"
                    autocomplete="off"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    placeholder="Enter your new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" id="resetButton">
                Reset My Password
            </button>

            <button
                type="button"
                id="changeEmailButton"
                style="background: #927A66;"
            >
                Use a Different Email
            </button>

        </form>

        <div
            class="message"
            id="message"
            role="status"
            aria-live="polite"
        ></div>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

        <div class="footer">
            A little space made with love ♡
        </div>

    </div>

    <script>
        const emailForm = document.getElementById('emailForm');
        const recoveryForm = document.getElementById('recoveryForm');

        const emailInput = document.getElementById('email');
        const securityAnswerInput = document.getElementById('securityAnswer');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        const securityQuestionDisplay =
            document.getElementById('securityQuestion');

        const message = document.getElementById('message');

        const questionButton =
            document.getElementById('questionButton');

        const resetButton =
            document.getElementById('resetButton');

        const changeEmailButton =
            document.getElementById('changeEmailButton');

        let verifiedEmail = '';

        // ==========================================
        // HELPER: DISPLAY MESSAGES
        // ==========================================

        function showMessage(text, success = false) {
            message.textContent = text;
            message.style.color = success ? '#58734F' : '#A94442';
        }

        // ==========================================
        // STEP 1: GET SECURITY QUESTION
        // ==========================================

        emailForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();

            message.textContent = '';

            questionButton.disabled = true;
            questionButton.textContent = 'Please wait...';

            try {
                const response = await fetch('/api/recovery-question', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || 'Unable to retrieve your security question.'
                    );
                }

                verifiedEmail = email;

                securityQuestionDisplay.textContent =
                    result.securityQuestion;

                emailForm.classList.add('hidden');
                recoveryForm.classList.remove('hidden');

                message.textContent = '';

            } catch (error) {
                showMessage(error.message);
            } finally {
                questionButton.disabled = false;
                questionButton.textContent = 'Continue';
            }
        });

        // ==========================================
        // STEP 2: VERIFY ANSWER AND RESET PASSWORD
        // ==========================================

        recoveryForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const securityAnswer = securityAnswerInput.value.trim();
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            message.textContent = '';

            if (newPassword.length < 8) {
                showMessage(
                    'Your new password must contain at least 8 characters.'
                );
                return;
            }

            if (new TextEncoder().encode(newPassword).length > 72) {
                showMessage('Your new password is too long.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Your passwords do not match.');
                return;
            }

            if (!securityAnswer) {
                showMessage('Please enter your security answer.');
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = 'Resetting Password...';

            try {
                const response = await fetch(
                    '/api/reset-password-security',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            email: verifiedEmail,
                            securityAnswer,
                            newPassword
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || 'Unable to reset your password.'
                    );
                }

                showMessage(
                    'Your password has been reset successfully! Redirecting to login...',
                    true
                );

                recoveryForm.reset();

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                showMessage(error.message);
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = 'Reset My Password';
            }
        });

        // ==========================================
        // CHANGE EMAIL ADDRESS
        // ==========================================

        changeEmailButton.addEventListener('click', function() {
            verifiedEmail = '';

            recoveryForm.reset();
            recoveryForm.classList.add('hidden');

            emailForm.classList.remove('hidden');

            message.textContent = '';
            emailInput.focus();
        });

    </script>

</body>
</html>
