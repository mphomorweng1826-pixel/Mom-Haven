
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Mom's Haven</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F5EBDD;
            color: #725541;
        }

        .navbar {
            background: #B69B83;
            padding: 20px 30px;
        }

        .navbar h2 {
            color: #FFFDF9;
            margin: 0;
            letter-spacing: 1px;
        }

        .container {
            max-width: 460px;
            margin: 80px auto;
            padding: 40px 30px;
            text-align: center;
            background: #FFFDF9;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(114,85,65,0.12);
        }

        .heart {
            font-size: 45px;
            color: #B69B83;
        }

        h1 {
            color: #725541;
            font-size: 28px;
        }

        p {
            color: #927A66;
            line-height: 1.7;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #D8C6B5;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            background: #B69B83;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #927A66;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #725541;
            text-decoration: none;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #A18B78;
        }

        @media (max-width: 520px) {
            .container {
                margin: 50px 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>Mom's Haven ♡</h2>
    </nav>

    <div class="container">

        <div class="heart">♡</div>

        <h1>Reset Your Password</h1>

        <p>
            Create a new password for your Mom's Haven account.
            Your new password must contain at least 8 characters.
        </p>

        <form id="resetPasswordForm">

            <input
                type="password"
                id="password"
                placeholder="Enter your new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="resetButton">
                Change Password
            </button>

        </form>

        <div class="message" id="message"></div>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

        <div class="footer">
            A little space made with love ♡
        </div>

    </div>

    <script>
        const resetPasswordForm =
            document.getElementById("resetPasswordForm");

        const message =
            document.getElementById("message");

        const resetButton =
            document.getElementById("resetButton");

        // Get the token from the reset link
        const urlParams = new URLSearchParams(window.location.search);

        const token = urlParams.get("token");

        // Check whether the reset link contains a token
        if (!token || !/^[a-f0-9]{64}$/.test(token)) {

            message.textContent =
                "This password reset link is invalid. Please request a new one.";

            message.style.color = "#A94442";

            resetPasswordForm.style.display = "none";
        }


        // Submit the new password
        resetPasswordForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            // Check password length
            if (password.length < 8) {

                message.textContent =
                    "Your password must contain at least 8 characters.";

                message.style.color = "#A94442";
                return;
            }

            // Check whether passwords match
            if (password !== confirmPassword) {

                message.textContent =
                    "The passwords do not match. Please try again.";

                message.style.color = "#A94442";
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Updating Password...";

            message.textContent = "";

            try {

                const response = await fetch("/api/reset-password", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "same-origin",

                    body: JSON.stringify({
                        token: token,
                        password: password
                    })

                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Unable to reset your password."
                    );
                }

                message.textContent = result.message;
                message.style.color = "#58734F";

                resetPasswordForm.reset();
                resetPasswordForm.style.display = "none";

                // Remove the token from the address bar
                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );

            } catch (error) {

                message.textContent = error.message;
                message.style.color = "#A94442";

                resetButton.disabled = false;
                resetButton.textContent = "Change Password";

            }

        });
    </script>

</body>
</html>
